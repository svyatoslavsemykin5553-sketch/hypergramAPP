name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Установка зависимостей
        run: npm install --no-audit --no-fund

      - name: Создание Android-проекта
        run: npx cap add android

      - name: Иконки и разрешения (микрофон для звонков)
        run: |
          RES=android/app/src/main/res
          rm -f $RES/mipmap-*/ic_launcher*
          cp -r icons/* $RES/
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#121110</color>\n</resources>\n' > $RES/values/ic_launcher_background.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Синхронизация сайта с приложением
        run: npx cap sync android

      - name: Сборка APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: hypergram-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
